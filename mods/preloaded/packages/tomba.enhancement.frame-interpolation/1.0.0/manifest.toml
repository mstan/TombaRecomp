format_version = 5
id = "tomba.enhancement.frame-interpolation"
version = "1.0.0"
name = "Tomba Frame Rate"
author = "mstan"
description = "Presentation-only temporal frame blending. Game logic, timers, and audio remain at their stock cadence."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SCUS-94236"
disc_sha256 = "25ada3dd51e70eb9f9218cd83fb02d73139750229fb44b012d62d183ab32eb13"

[[feature]]
id = "frame-interpolation"
name = "Temporal Frame Blending"
description = "Blend completed game frames at the selected presentation rate without accelerating gameplay, timers, or audio. This is not motion-vector frame generation."
group = "Frame Rate"
default_enabled = false

[[option]]
feature = "frame-interpolation"
id = "rate"
label = "Presentation rate"
description = "Follow the display for even cadence, or choose a fixed diagnostic rate. The original game simulation remains untouched. Requires OpenGL."
group = "Frame Rate"
type = "choice"
default = "uncapped"

[[option.choice]]
value = "60"
label = "60 FPS"

[[option.choice]]
value = "120"
label = "120 FPS"

[[option.choice]]
value = "144"
label = "144 FPS"

[[option.choice]]
value = "165"
label = "165 FPS"

[[option.choice]]
value = "uncapped"
label = "Display refresh (Recommended)"

[[plugin]]
feature = "frame-interpolation"
id = "tomba.framerate.60"
when = { rate = "60" }

[[plugin]]
feature = "frame-interpolation"
id = "tomba.framerate.120"
when = { rate = "120" }

[[plugin]]
feature = "frame-interpolation"
id = "tomba.framerate.144"
when = { rate = "144" }

[[plugin]]
feature = "frame-interpolation"
id = "tomba.framerate.165"
when = { rate = "165" }

[[plugin]]
feature = "frame-interpolation"
id = "tomba.framerate.uncapped"
when = { rate = "uncapped" }
