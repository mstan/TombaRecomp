format_version = 5
id = "tomba.enhancement.hd-textures"
version = "1.0.0"
name = "HD Texture Packs"
author = "psxrecomp"
description = "Load compatible DuckStation PNG/JPEG/WebP replacements or capture original textures while playing. Resident backgrounds publish during play; exit to finish pending PNGs. OpenGL displays replacements. No texture artwork is bundled."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SCUS-94236"

[[feature]]
id = "hd-textures"
name = "HD Texture Packs"
description = "Disabled by default. Install compatible PNG/JPEG/WebP replacements or collect original textures in dumps during play. Exit to finish pending captures. Options apply on Play."
group = "Visual"
default_enabled = false

[[resource]]
feature = "hd-textures"
id = "pack"
label = "Texture pack folder"
description = "Open folder to add replacement images or collect dumped originals. The default is mods/texture-packs/SCUS-94236 beside the executable. Change folder accepts an empty directory or an existing compatible pack."
format = "directory"
required = true

[[option]]
feature = "hd-textures"
id = "replacements"
label = "Load replacements"
description = "Display matching PNG/JPEG/WebP artwork from replacements in OpenGL. Missing or unsupported textures keep their original artwork. Turn this off when collecting originals."
type = "boolean"
default = "true"

[[option]]
feature = "hd-textures"
id = "dump"
label = "Dump textures"
description = "Collect original texture usage under dumps during play, including resident backgrounds. Exit to finish pending PNGs, then edit the files you need."
type = "boolean"
default = "false"

[[plugin]]
feature = "hd-textures"
id = "psx.hd-textures"
