format_version = 5
id = "tomba.experimental.seamless"
version = "0.1.0"
name = "Seamless Loading"
author = "mstan"
description = "Removes loading screens using resident assets at normal game and audio speed. Prepares a cache once from the stock SCUS-94236 disc. Asset replacement mods are not supported."
resolver = "declarative"
save_compatibility = "shared"
conflicts = ["tomba.enhancement.fast-loading"]

[[target]]
game_id = "SCUS-94236"
disc_sha256 = "25ada3dd51e70eb9f9218cd83fb02d73139750229fb44b012d62d183ab32eb13"

[[feature]]
id = "resident-assets"
name = "Seamless Loading"
description = "Prepare disc assets once, then keep them in memory for menu and area transitions. Disable to restore retail loading. Whole-game coverage is still under test."
group = "Quality of Life"
default_enabled = true

[[plugin]]
feature = "resident-assets"
id = "tomba.seamless"
