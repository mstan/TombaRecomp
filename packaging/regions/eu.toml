schema = 1
[product]
name = "TombiRecomp-Europe-SCES01330-Rev1"
display_name = "Tombi! (Europe, En/Fr/De/It/Nl)"
exe_name = "TombiRecompEU"
version_file = "VERSION"
game_toml = "eu/release/game.toml"
player_game_toml = "eu/release/game.toml"
runtime_target = "tombi-eu-seamless"
zip_folder = "TombiRecomp-Europe-SCES01330-Rev1-windows-x64"
[build]
regenerate = false
selective_pgo = false
[aot]
mode = "audited-cache"
[overlay_toolchain]
ship = true
[payload]
game_options = false
start_here = "packaging/regions/eu-START_HERE.txt"
files = [
  {from = "eu/release/docs/README.md", to = "README.md"},
  "LICENSE",
  "PERMISSIONS.md",
  {from = "eu/release/docs/HD_TEXTURE_PACKS.md", to = "docs/HD_TEXTURE_PACKS.md"},
  {from = "psxrecomp/docs/DUCKSTATION_TEXTURE_FORMAT.md", to = "docs/DUCKSTATION_TEXTURE_FORMAT.md"},
  {from = "eu/release/licenses/Lato-OFL.txt", to = "licenses/Lato-OFL.txt"},
  {from = "eu/release/licenses/NotoSansSymbols2-OFL.txt", to = "licenses/NotoSansSymbols2-OFL.txt"},
  {from = "eu/seeds/boot.txt", to = "seeds/boot.txt"},
]
[[hooks.post_stage]]
command = ["{python}", "tools/validate_region_release.py", "eu", "{build_dir}", "{stage}"]
