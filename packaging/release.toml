schema = 1

[product]
name = "TombaRecomp"
display_name = "Tomba! (USA)"
exe_name = "TombaRecomp"
version_file = "VERSION"
player_game_toml = "packaging/release/game.toml"

[build]
cmake_args = [
  "-DPSX_RECOMP_UI=ON", "-DPSX_ENABLE_VULKAN=OFF",
  "-DPSX_EXECUTION_PROFILE=ENHANCED", "-DPSX_GL_BATCH_IMPL=HLE",
  "-DTOMBA_GEOMETRY_IMPL=HLE", "-DTOMBA_GEOMETRY_FLAT_TRIANGLE=ON",
  "-DTOMBA_NATIVE_IDLE_WAIT=ON",
]

[aot]
mode = "cache"
profile = "aot/overlays.json"
cps = false

[overlay_toolchain]
ship = true

[payload]
start_here = "packaging/release/OPTIMIZATION_START_HERE.txt"
files = ["README.md", "RELEASE_NOTES.md", "docs/ARCHIPELAGO.md"]
