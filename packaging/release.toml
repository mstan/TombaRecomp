schema = 1

[product]
name = "TombaRecomp"
display_name = "Tomba! (USA)"
exe_name = "TombaRecomp"
version_file = "VERSION"
player_game_toml = "packaging/release/game.toml"

[build]
cmake_args = [
  "-DPSX_RECOMP_UI=ON", "-DPSX_ENABLE_VULKAN=OFF",
  "-DPSX_EXECUTION_PROFILE=ENHANCED", "-DPSX_GL_BATCH_IMPL=HLE",
  "-DTOMBA_GEOMETRY_IMPL=HLE", "-DTOMBA_GEOMETRY_FLAT_TRIANGLE=ON",
  "-DTOMBA_NATIVE_IDLE_WAIT=ON",
]

[aot]
mode = "cache"
profile = "aot/overlays.json"
cps = false

[overlay_toolchain]
ship = true

[diagnostics]
game_id = "SCUS-94236"
package_id = "tomba.diagnostics"
allow_hd_textures = true

[payload]
start_here = "packaging/release/OPTIMIZATION_START_HERE.txt"
files = ["README.md", "RELEASE_NOTES.md", "docs/ARCHIPELAGO.md", "docs/regional/audio-sync.md"]

[linux]
app_run = "packaging/linux/AppRun"
desktop_file = "packaging/linux/io.github.mstan.TombaRecomp.desktop"
icon = "launcher_assets/img/boxart.tga"
payload_dir = "tombarecomp"
env_prefix = "TOMBA_RECOMP"
prune_unreferenced_libs = true
