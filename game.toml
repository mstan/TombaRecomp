# Autofilled by tools/new_project_layout/probe_disc.py from your legal dump.
# Review before shipping. Runtime quirks / overlay seeds still need hand work.

[game]
name = "TombaRecomp"
id = "SCUS-94236"
players = 1
exe = "disc/SCUS_942.36"
disc = "disc/Tomba! (USA).cue"
load_address = "0x80010000"
entry_pc = "0x8006B58C"
text_size = "0x00088000"
stack_base = "0x801FFFF0"

# Digests are for data Track 01 (first BINARY FILE / TRACK 01).
[prepare_disc]
out_dir = "disc"
bin_name = "Tomba! (USA).bin"
cue_name = "Tomba! (USA).cue"
boot_exe = "SCUS_942.36"
known_sizes = [280193760]
known_md5 = [
  "c80636a28de4abcfa34f9e57fb3b043d",
]
known_sha1 = [
  "c259ec7ff6ef4163913991f4e4db2eff71702818",
]

[recompiler]
seeds = "seeds/ghidra_funcs.txt"
out_dir = "generated"
strict = true
mod_function_entry_funcs = ["0x8005E08C", "0x8005A184"]

[runtime]
window_title = "TombaRecomp Recompiled"
memcard_dir = "saves"
# Tomba's runtime-loaded code must enter the overlay cache pipeline: capture
# variants, compile native shards, and load matching shards on later runs.
# Without this, every overlay stays on the dirty-RAM interpreter.
overlay_cache = true

[video]
renderer = "opengl"
# Native movie playback is the baseline. The default-off Tomba Skip FMVs mod
# owns activation; keep the generic recomp-ui Settings row hidden for Tomba.
auto_skip_fmv = false
offer_skip_fmv = false
# Tomba-specific teardown metadata used by the Skip FMVs mod. The runtime writes
# the active movie's frame total down to fmv_skip_end_total so the game's own
# MDEC player ends every movie, including ones that never poll START.
fmv_skip_total_table = 0x80077728
fmv_skip_movie_id = 0x1F8001CD
fmv_skip_end_total = 3
aspect_ratio = "4:3"

[controller]
default_mode = "digital"
multitap_analog = true

# The default presentation remains faithful 4:3.  The bundled Tomba
# enhancement activates this native-wide renderer after its mod plan commits.
# Its Fit choice starts at 16:9 and follows the live window aspect without an
# upper ratio limit. Wider content coverage remains experimental.
[widescreen]
offer = false
adaptive_view = true
native_wide = true
sprite_tag_funcs = ["0x8005E08C"]
sprite_anchor_addr = "0x1F800070"
hud_sprt_squash = true

# Tomba's object classifier family uses a 320px camera window.  Emit the
# runtime margin into its draw/retirement predicates so native-wide rendering
# admits the entire visible fringe.  The additional 32px lead keeps objects
# resident just outside either expanded edge instead of popping on the border.
# All generated substitutions are identity at 4:3.
[widescreen.cull]
guard_pixels = 32
activation_guard_pixels = 32
bias_sites = ["0x80022E78", "0x80022F94", "0x80022FE8", "0x80023068"]
range_sites = ["0x80022E80", "0x80022F9C", "0x80022FF0", "0x80023070"]
a1_sites = ["0x80022C34", "0x80022D68", "0x800230FC"]
auto_screen_x = true
auto_backdrop = true

# Preserve the established Tomba backdrop treatment for the fallback squash
# path and overlay variants; the native-wide path uses the generated backdrop
# preload above to fill its wider compositor margins.
[widescreen.backdrop]
x_sites = ["0x801217B4", "0x8012196C"]
unsquash_funcs = ["0x8004DB3C"]

# Online mount gate: digests + track count + optional TOC fingerprint
# (see docs/NETPLAY.md).
[netplay]
require_cue = true
required_tracks = 1
required_disc_fp = "84ce733697c16a6bddbd319504b1ee50a02f4c2a42f4eee049092a6da286a4b5"
