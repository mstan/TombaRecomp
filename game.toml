[game]
name = "Tomba!"
id = "SCUS-94236"
exe = "tomba/SCUS_942.36"
disc = "tomba/tomba.cue"
load_address = "0x80010000"
entry_pc = "0x8006B58C"
text_size = "0x00088000"
stack_base = "0x801FFFF0"

[recompiler]
seeds = "seeds/ghidra_funcs.txt"
bios_thunks = "seeds/tomba_bios_thunks.txt"
out_dir = "generated"
strict = true

[runtime]
debug_port = 4470
window_title = "Tomba! Recompiled"
memcard_dir = "saves"
disc_speed = "instant"
fast_boot  = false   # set false to watch BIOS logos
overlay_cache = true  # overlay DLL cache (Inc1-D write-invalidation under test)
# Step 4 turbo-through-loads: 3-5x load compression. ON by default since Bug B
# was root-caused + fixed (psxrecomp ffc1521: the "turbo raises freeze
# incidence" was the frame-pacing TOCTOU underflow, not an interrupt race;
# turbo merely added the CPU load that widened the preemption window).
turbo_loads = true
# Step 2.8: auto capture+compile of uncovered overlay variants (background;
# run via cmd.exe /C with cwd = project root; needs python + gcc on PATH).
# Chained: after each compile, additively back up captures + cache into the
# clean-proof coverage vault (../_coverage_vault, outside any build dir) so a
# cmake clean / fresh worktree never costs accumulated coverage.
overlay_autocompile_cmd = "python ../psxrecomp/tools/compile_overlays.py --captures build-stable/overlay_captures.json --game-toml game.toml --recompiler ../psxrecomp/recompiler/build/psxrecomp-game.exe --runtime-include ../psxrecomp/runtime/include --out-dir build-stable/cache && python ../psxrecomp/tools/coverage_vault.py merge --vault ../_coverage_vault/SCUS-94236 --captures build-stable/overlay_captures.json --cache build-stable/cache/SCUS-94236"

[video]
# Visual enhancement options.
# supersampling: internal-resolution SSAA factor (1 = native PSX, 2..4 render
#   the scene at N* the resolution and downsample on present -> true
#   supersampling + edge anti-aliasing). 2 is a good quality/perf default;
#   raise to 3 or 4 for sharper edges if your CPU holds 59.94 fps.
# antialiasing: linear present filtering (smooths the downscale and any window
#   resize). Set false for sharp, unfiltered pixels.
# texture_filtering: "nearest" (native PSX look) or "bilinear" (smooths
#   textures and 2D backgrounds). Off by default.
# renderer: "software" (CPU rasterizer) or "opengl" (GPU-authoritative VRAM
#   FBO backend). OpenGL moves rasterization + supersampling onto the GPU, so
#   fill-heavy scenes (e.g. the mushroom forest) hold 59.94 fps even at
#   supersampling 2..4. Falls back to software automatically if GL init fails.
# aspect_ratio: display aspect "W:H" ("4:3" = native, the default). "16:9"
#   enables the EXPERIMENTAL widescreen hack: the GTE projection is squashed
#   horizontally and the frame is presented stretched to 16:9, revealing extra
#   world at the screen edges. Tomba's world is GTE-projected 3D, so geometry
#   keeps correct proportions; screen-space 2D (HUD, sprite quads, FMV) looks
#   stretched, and world-space object culling can pop near the edges. Also
#   selectable in the launcher (Settings -> Aspect ratio), which persists to
#   settings.toml and overrides this value.
supersampling     = 2
antialiasing      = true
texture_filtering = "nearest"
renderer          = "opengl"
# auto_skip_fmv: auto-skip full-motion videos (the game's own skip is triggered
# the instant a streaming FMV is detected). Ships OFF; the launcher's
# Settings → "Skip FMVs" toggle turns it on (persisted to settings.toml).
auto_skip_fmv     = false
aspect_ratio      = "4:3"

# ── Audit-specific config (consumed by psxrecomp/tools/*.py and tests) ──
#
# Schema mirrors psxrecomp/bios/SCPH1001.toml. Paths are relative to the
# TombaRecomp project root.

[audit]
# Dynamic discovery — no Ghidra function-starts file for Tomba; the
# recompiler discovers functions by walking control flow from entry_pc.
# function_starts left absent on purpose.

# Code region: Tomba's text segment is contiguous from load_address for
# text_size bytes. Single region keeps L1/coverage audits scoped to code.
[[audit.regions]]
name        = "Text"
rom_start   = "0x800"          # offset within the PS-X EXE file (skip header)
rom_end     = "0x88800"        # rom_start + text_size
vaddr_base  = "0x80010000"

# Address normalization: just KSEG masking. No remaps (game loads
# contiguously at vaddr_base; no kernel-style relocation).
[audit.normalize]
kseg_mask = "0x1FFFFFFF"
