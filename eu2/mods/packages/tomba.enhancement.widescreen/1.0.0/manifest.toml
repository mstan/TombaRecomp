format_version = 5
id = "tomba.enhancement.widescreen"
version = "1.0.0"
name = "Widescreen"
author = "mstan; michaelm-afk (European integration)"
description = "Experimental rendering that fits the window from 4:3 through 34:9, with clean side bars in wider windows."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SCES-01331"
disc_sha256 = "2eba3dfdd25f5d270d47f5fe408391971aa25ee09c6aac9874bba4e3bf6f32cc"

[[feature]]
id = "widescreen"
name = "Widescreen"
description = "Enable Tomba's native-wide gameplay view. The render target and resident-object culling expand with the current window; extreme-width content and enemy spawning are experimental."
group = "Display"
default_enabled = false
quick = true

[[option]]
feature = "widescreen"
id = "aspect"
label = "View"
description = "Fit to Window follows live resizing from 4:3 through 34:9. Wider windows keep clean side bars. Fixed ratios use the same widescreen renderer."
group = "Display"
type = "choice"
default = "Fit"

[[option.choice]]
value = "Fit"
label = "Fit to Window"

[[option.choice]]
value = "16:9"
label = "16:9"

[[option.choice]]
value = "21:9"
label = "21:9"

[[option.choice]]
value = "32:9"
label = "32:9"

[[plugin]]
feature = "widescreen"
id = "tomba.widescreen"
